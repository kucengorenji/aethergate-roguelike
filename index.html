<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d6352" />
    <title>Aethergate</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div class="crosshair" id="crosshair" aria-hidden="true"></div>

    <div class="controls">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>Mouse</kbd> look ·
      <kbd>R</kbd> reset · <kbd>Esc</kbd> release mouse · <kbd>`</kbd> debug
    </div>

    <div class="lock-prompt" id="lock-prompt">
      <p class="lock-title">Click to play</p>
      <p class="lock-hint">The mouse controls the camera. Press <kbd>Esc</kbd> to release it.</p>
    </div>

    <div class="fatal" id="fatal" hidden>
      <p>This browser could not start the game (WebGPU or WebGL 2 is required).</p>
      <pre></pre>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
