# Fast checks on every commit, full gate before push.
pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,js,mjs,json,md,yml,css,html}'
      run: pnpm prettier --check {staged_files}
    lint:
      glob: '*.{ts,js,mjs}'
      run: pnpm eslint --max-warnings 0 {staged_files}
    typecheck:
      glob: '*.ts'
      run: pnpm typecheck

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit {1}

pre-push:
  commands:
    test:
      run: pnpm test
    e2e:
      run: pnpm e2e
